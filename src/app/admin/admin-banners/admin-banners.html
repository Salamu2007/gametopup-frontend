<div class="banners-admin" dir="rtl">
  <header class="page-header">
    <div>
      <h2 class="page-title">📢 إدارة البانرات</h2>
      <p class="page-subtitle">أضف، حرِّك، وحافظ على البانرات الفعالة للموقع</p>
    </div>
    <button class="btn btn-add" (click)="openAddForm()">➕ إضافة بانر</button>
  </header>

  <div *ngIf="isLoading" class="loading-state">
    <p>جاري تحميل البانرات...</p>
  </div>

  <div *ngIf="!isLoading && banners.length === 0" class="no-data">
    <p>لا توجد بانرات حتى الآن.</p>
  </div>

  <div *ngIf="!isLoading && banners.length > 0" class="banner-table-container">
    <table class="banner-table">
      <thead>
        <tr>
          <th>المعاينة</th>
          <th>العنوان</th>
          <th>الحالة</th>
          <th>ترتيب</th>
          <th>الإجراءات</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let banner of banners">
          <td class="banner-preview">
            <img [src]="resolveImageUrl(banner.imageUrl) || '/assets/images/comingsoon.png'" alt="Banner preview">
          </td>
          <td>
            <strong>{{ banner.title }}</strong>
            <p>{{ banner.subtitle }}</p>
          </td>
          <td>
            <button class="btn btn-toggle" [class.active]="banner.isActive" (click)="toggleActive(banner)">
              {{ banner.isActive ? 'مفعل' : 'مخفي' }}
            </button>
          </td>
          <td>
            <div class="order-controls">
              <input type="number" [(ngModel)]="banner.sortOrder" name="order{{banner._id}}" min="0" />
              <button class="btn btn-save" (click)="saveOrder(banner)">حفظ</button>
            </div>
            <div class="move-buttons">
              <button class="btn btn-small" (click)="moveBanner(banner, 'up')">↑</button>
              <button class="btn btn-small" (click)="moveBanner(banner, 'down')">↓</button>
            </div>
          </td>
          <td class="actions">
            <button class="btn btn-edit" (click)="openEditForm(banner)">تعديل</button>
            <button class="btn btn-delete" (click)="deleteBanner(banner._id)">حذف</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="showForm" class="modal-overlay" (click)="closeForm()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h3>{{ formTitle }}</h3>
        <button class="close-btn" (click)="closeForm()">✕</button>
      </div>

      <form class="banner-form" (ngSubmit)="submitForm()">
        <div class="form-group">
          <label>عنوان البانر *</label>
          <input type="text" [(ngModel)]="formData.title" name="title" required />
        </div>

        <div class="form-group">
          <label>وصف صغير</label>
          <textarea [(ngModel)]="formData.subtitle" name="subtitle" rows="2"></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>رابط الزر</label>
            <input type="text" [(ngModel)]="formData.linkUrl" name="linkUrl" placeholder="https://" />
          </div>
          <div class="form-group">
            <label>نص الزر</label>
            <input type="text" [(ngModel)]="formData.ctaText" name="ctaText" placeholder="عرض الآن" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>ترتيب العرض</label>
            <input type="number" [(ngModel)]="formData.sortOrder" name="sortOrder" min="0" />
          </div>
          <div class="form-group form-checkbox">
            <label>
              <input type="checkbox" [(ngModel)]="formData.isActive" name="isActive" />
              مفعل
            </label>
          </div>
        </div>

        <div class="form-group">
          <label>صورة البانر *</label>
          <input type="file" (change)="onImageSelected($event)" accept="image/*" [disabled]="uploadingImage" />
          <div *ngIf="imagePreview" class="image-preview">
            <img [src]="imagePreview" alt="Banner preview" />
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-submit">{{ editingId ? 'تحديث' : 'حفظ' }}</button>
          <button type="button" class="btn btn-cancel" (click)="closeForm()">إلغاء</button>
        </div>
      </form>
    </div>
  </div>
</div>
